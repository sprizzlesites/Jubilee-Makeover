kind = "web"
previewPath = "/"
title = "Garfield Jubilee"
version = "1.0.0"
id = "artifacts/garfield-jubilee"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21563

[services.development]
run = "pnpm --filter @workspace/garfield-jubilee run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/garfield-jubilee", "run", "build" ]
publicDir = "artifacts/garfield-jubilee/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21563"
BASE_PATH = "/"
