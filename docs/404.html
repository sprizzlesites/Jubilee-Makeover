<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Garfield Jubilee Association</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<!--
  Styles are inlined rather than linked: GitHub Pages serves this file for
  any missing path, including nested ones, where a relative stylesheet href
  would resolve against the wrong directory.
-->
<style>
  :root { --bg: hsl(22 14% 9%); --fg: hsl(38 25% 94%); --primary: hsl(33 95% 58%); --muted: hsl(30 10% 55%); }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }
  .wrap { max-width: 32rem; position: relative; z-index: 1; }
  .glow {
    position: fixed;
    top: 50%; left: 50%;
    translate: -50% -50%;
    width: 40rem; height: 20rem;
    background: hsl(33 95% 58% / .07);
    filter: blur(110px);
    border-radius: 50%;
    pointer-events: none;
  }
  .code {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(7rem, 26vw, 15rem);
    line-height: .85;
    letter-spacing: .02em;
    color: var(--primary);
    text-shadow: 0 0 80px hsl(33 95% 58% / .4);
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.75rem, 6vw, 2.75rem);
    font-weight: 400;
    letter-spacing: .04em;
    margin: 1rem 0 .75rem;
  }
  p { color: var(--muted); font-weight: 300; line-height: 1.7; margin-bottom: 2.5rem; }
  a.home {
    display: inline-flex;
    align-items: center;
    gap: .75rem;
    background: var(--primary);
    color: var(--bg);
    padding: 1rem 2rem;
    font-size: .875rem;
    font-weight: 600;
    text-decoration: none;
    transition: filter .3s;
  }
  a.home:hover { filter: brightness(1.1); }
  .mark {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: .25em;
    font-size: .875rem;
    color: hsl(38 25% 94% / .35);
    margin-bottom: 2rem;
  }
  @media (prefers-reduced-motion: no-preference) {
    .wrap { animation: in .7s cubic-bezier(.16,1,.3,1) both; }
    @keyframes in { from { opacity: 0; transform: translateY(20px); } }
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="wrap">
    <p class="mark">GARFIELD JUBILEE ASSOCIATION</p>
    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The page you're looking for may have moved or never existed. Let's get you back
      to where the work is happening.</p>
    <a class="home" id="home" href="/">
      Back to home
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
  </div>

  <script>
    /* Point "home" at the site root whether this is served from a
       github.io project path (/Repo-Name/) or a custom domain (/). */
    (function () {
      var link = document.getElementById('home');
      if (/\.github\.io$/.test(location.hostname)) {
        var seg = location.pathname.split('/')[1];
        if (seg) link.href = '/' + seg + '/';
      }
    })();
  </script>
</body>
</html>
